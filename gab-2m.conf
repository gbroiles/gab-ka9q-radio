[global]
hardware = rtlsdr  # or airspy, rtlsdr, rx888, etc.
mode = pm           # Phase modulation (what amateur radio calls FM)
status = 2m.local
iface = lo          # Use loopback to avoid flooding your network
data = 2m-pcm.local

# samprate/frequency MUST live in the hardware section, not [global].
# radiod loads the front end driver with the section named by 'hardware =',
# so [global] samprate/frequency are silently ignored (radiod even logs
# '[global] key "frequency" not found'). Before 2026-08-06 they were in
# [global], so the RTL-SDR ran at rtlsdr.c's DEFAULT_SAMPRATE of 1.8 MHz
# (usable +/-0.47*1.8 = +/-846 kHz) with an unlocked, auto-tuning LO. Every
# edit to the freq list below silently re-centered that narrow window and
# pushed other repeaters out of band -- which is how 146.115 (21k recordings)
# and 146.085 died on 2026-04-25 without anything touching the radios.
[rtlsdr]
device = rtlsdr
gain = 15
# 2.4 MHz is the highest rate an RTL-SDR sustains without USB overruns.
# Usable IF is +/-0.47*samprate = +/-1.128 MHz.
samprate = 2400000
# Centered on the span below (146.085 - 147.945), giving 145.887 - 148.143
# with ~198 kHz of margin at each edge. Setting this also locks the LO
# (rtlsdr.c:234-237) so the passband stops moving when freqs are added.
frequency = 147015000

[2m RPT]
mode = pm
data = fmrpt_out-pcm.local
#freq = "146m52 146m85 146m25 146m67 146m07 145m37 144m77 145m29 144m69 146m655 146m055 147m945"
#freq1 = "146m085 145m485 146m115 145m515 146m895 146m295 145m17 144m57 147m105 147m705 147m345"

#freq = "146m52 146m85 146m67 145m37 145m29 146m655 146m085 146m115 146m885 145m17 147m105 147m945"
#freq = "146m52 146m85 146m67 145m37 145m29 146m655 146m085 146m115 146m885 145m17 147m945"

# Every entry must fall inside frequency +/- 1.128 MHz (145.887 - 148.143).
# 146m885 was a typo for 146m895 (GEARS W), introduced in fe600b3 -- it has
# never produced a single recording.
# 145m17, 145m29 and 145m37 are dropped: 147m945 is kept instead, and the two
# cannot coexist in 2.4 MHz. Cheap trade -- across all of D1 those three have
# produced 0, 1 and 0 recordings, against 326 for 147m945.
# 147m105 (W6GRC) left out deliberately.
freq = "146m52 146m85 146m67 146m655 146m085 146m115 146m895 147m945"

#146m52 2m simplex
#146m85 146m25 GEARS E
#146m67 146m07 W6PAR (Paradise)
#145m37 144m77 W6PAR (Magalia)
#145m29 144m69 W6SCR
#146m655 146m055 W6AF
#146m085 145m485 WD6AXM (Sutter Butte)
#146m115 K6LNK (Stonyford)
#146m895 146m295 GEARS W"
#145m17 144m57 AF6OA VHF"
#147m105 147m705 W6GRC"
#147m945 147m345 new W6RHC"
